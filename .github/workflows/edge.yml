# Edge builds (docs/IMPLEMENTATION.md §23.3, §23.7, D39): every push to main that is not docs-only builds the next
# patch's edge prerelease on macos-26, then attests it. `desk update --channel edge` installs only what this workflow
# attested on refs/heads/main. `attest` takes `pack`'s artifact by its id and checks its sha256 against the digest
# `pack` reported before it attests anything, so no other job of the run can hand it other bytes (D86). Until slice 1c
# adds `npm run pack` there is no runtime: the build stamps and reports, and nothing is attested.
name: edge

on:
  push:
    branches: [main]
    # Everything but what ci-changes.mjs calls docs-only: docs/, root Markdown and LICENSE, less the owner-merge paths
    # among them (the agent rules: CLAUDE.md, CLAUDE.local.md, AGENTS.md, AGENTS.override.md, .claude/, .cursor/,
    # .cursorrules and .mcp.json at any depth, and docs/CONTRIBUTING.md). GitHub's filter compares names exactly, so a
    # case or NFKC variant of one (`claude.md`), which change detection folds and calls code (D82), builds no edge
    # release; such a file changes no runtime.
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "!LICENSE"
      - "docs/CONTRIBUTING.md"
      - "**/CLAUDE.md"
      - "**/CLAUDE.local.md"
      - "**/AGENTS.md"
      - "**/AGENTS.override.md"
      - "**/.claude/**"
      - "**/.cursor/**"
      - "**/.cursorrules"
      - "**/.mcp.json"
      - "**/.gitattributes"
  workflow_dispatch:

permissions: {}

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-darwin.yml
    permissions:
      contents: read
    with:
      channel: edge
      ref: ${{ github.sha }}

  attest:
    needs: build
    if: needs.build.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download pack's artifact by its id, as it was uploaded (still zipped)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifact
          skip-decompress: true
          digest-mismatch: error
      - name: Check it is the artifact pack uploaded (its sha256), then unpack it
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          zips=(artifact/*)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error title=attest::Expected pack's artifact alone; found ${#zips[@]} files."
            exit 1
          fi
          actual="$(sha256sum "${zips[0]}" | cut -d ' ' -f 1)"
          if ! [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || [ "$actual" != "$ARTIFACT_DIGEST" ]; then
            echo "::error title=attest::The downloaded artifact's sha256 is not the digest pack reported; nothing is attested."
            exit 1
          fi
          mkdir edge
          unzip -q "${zips[0]}" -d edge
      - name: Check the files against SHA256SUMS
        working-directory: edge
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest build provenance for every file SHA256SUMS names
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: edge/SHA256SUMS
