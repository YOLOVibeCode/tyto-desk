# Default CI (docs/IMPLEMENTATION.md §18, §23.7). `ci-ok` is the one required build check: a docs-only pull request
# passes it with `scan` alone, and it fails when any needed job failed. Never installs a browser, never uses a secret;
# every action is pinned to a commit SHA, and scripts get event text through env only.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # The base commit's ci-changes.mjs classifies the pull request's files, so a PR cannot change how it is judged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/delivery
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Docs only, or code?
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f scripts/delivery/ci-changes.mjs ]; then
            node scripts/delivery/ci-changes.mjs
          else
            # A base from before slice D1 has no ci-changes.mjs: everything is code, which runs every check.
            echo "::notice title=changes::The base commit has no scripts/delivery/ci-changes.mjs: treating this as code."
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Secret scan (code, docs and tests; no path allowlist)
        run: node scripts/check-secrets.mjs
      - name: Install gitleaks (sha256-verified)
        env:
          GITLEAKS_VERSION: 8.24.3
          # gitleaks_8.24.3_checksums.txt, linux_x64
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit (redacted)
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --verbose'

  check:
    name: check (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The engines floor for Node 22, and .nvmrc.
        node: ["22.22.2", "26.10.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run lint:imports
      - run: npm run lint:extension
      - run: npm run lint:listen
      - run: npm run lint:install-scripts
      - run: npm run lint:workflows
      - run: npm run secrets:scan
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  macos:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build-darwin.yml
    permissions:
      contents: read
    with:
      channel: pr
      ref: ${{ github.event.pull_request.head.sha }}

  ci-ok:
    if: always()
    needs: [changes, scan, check, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/delivery
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Did every needed job pass?
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/delivery/ci-ok.mjs
