# Owner-merge (docs/IMPLEMENTATION.md §23.1, D50, D69). main's dependency-free owner-merge.mjs reads the pull
# request's file list and head branch through the API; for the release PR, a PR that touches an owner-merge path
# (scripts/delivery/owner-paths.json), or one whose files the API did not list in full, it turns auto-merge off, adds
# the `owner-merge` label and comments once, again whenever someone turns auto-merge on or removes the label; otherwise
# it removes the label. Not a required check. It never checks out or runs anything from the pull request.
name: owner-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, auto_merge_enabled, unlabeled]

permissions: {}

concurrency:
  group: owner-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  owner-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/delivery
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Label owner-merge paths and the release PR, and turn their auto-merge off
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/delivery/owner-merge.mjs
