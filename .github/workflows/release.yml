# Releases (docs/IMPLEMENTATION.md §23.8; RELEASING.md). A v-tag, which only the release App creates, starts it: `plan`
# (classifyBuild), `build` (macos-26), and the `live` gate; then `publish`, which waits for the owner's approval of the
# publish environment, takes `pack`'s artifact by its id and checks its sha256 against the digest `pack` reported (D86),
# attests, uploads to the draft release, checks the assets and publishes it; then `verify`.
# Dispatched on main it is a dry run: plan, build and live as a stable-shaped build, and nothing is tagged, released or
# attested. Until slice 1c adds `npm run pack` (D58) and slice D2 adds scripts/delivery/install.sh (D67), a real
# release refuses in `plan`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dry-run: ${{ steps.mode.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: A dry run on main, or a release of a tag?
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "dry-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: classifyBuild (a stable build of a v-tag on main, or a dry run on main)
        id: plan
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry-run }}
        run: |
          args=(--plan --expect-channel stable)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/delivery/stamp.mjs "${args[@]}"
      - name: A release needs a runtime (slice 1c; D58) and its installer (slice D2; D67)
        if: steps.mode.outputs.dry-run != 'true'
        run: |
          missing=0
          if [ "$(npm pkg get scripts.pack)" = "{}" ]; then
            echo "::error title=release::There is no runtime to release until slice 1c adds npm run pack (D58)."
            missing=1
          fi
          if [ ! -f scripts/delivery/install.sh ]; then
            echo "::error title=release::There is no installer to release until slice D2 adds scripts/delivery/install.sh (D67)."
            missing=1
          fi
          exit "$missing"

  build:
    needs: plan
    uses: ./.github/workflows/build-darwin.yml
    permissions:
      contents: read
    with:
      channel: stable
      ref: ${{ github.sha }}
      dry-run: ${{ needs.plan.outputs.dry-run == 'true' }}

  live:
    needs: plan
    uses: ./.github/workflows/live-run.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  publish:
    needs: [plan, build, live]
    if: needs.plan.outputs.dry-run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Download pack's artifact by its id, as it was uploaded (still zipped)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifact
          skip-decompress: true
          digest-mismatch: error
      - name: Check it is the artifact pack uploaded (its sha256), then unpack it
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          zips=(artifact/*)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error title=publish::Expected pack's artifact alone; found ${#zips[@]} files."
            exit 1
          fi
          actual="$(sha256sum "${zips[0]}" | cut -d ' ' -f 1)"
          if ! [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || [ "$actual" != "$ARTIFACT_DIGEST" ]; then
            echo "::error title=publish::The downloaded artifact's sha256 is not the digest pack reported; nothing is published."
            exit 1
          fi
          mkdir release
          unzip -q "${zips[0]}" -d release
      - name: Check the files against SHA256SUMS
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - name: Find the tag's release, and resume an earlier attempt
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSETS_DIR: release
        run: node scripts/delivery/publish.mjs prepare
      - name: Attest build provenance for every file SHA256SUMS names
        if: steps.prepare.outputs.next == 'attest'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Upload to the draft, check its assets, publish (latest only when highest)
        if: steps.prepare.outputs.next == 'attest'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSETS_DIR: release
        run: node scripts/delivery/publish.mjs finish

  verify:
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - name: gh 2.102.0 or later (exact --cert-identity and --source-ref matching)
        run: |
          version="$(gh --version | sed -n 's/^gh version \([0-9][0-9.]*\).*/\1/p')"
          if ! printf '%s\n%s\n' 2.102.0 "$version" | sort --version-sort --check=quiet; then
            echo "::error title=verify::The runner's gh is $version; verify needs 2.102.0 or later."
            exit 1
          fi
      - name: The release, its assets, and their provenance, as desk update checks them
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release verify "$TAG" --repo "$REPOSITORY"
          dir="$(mktemp -d)"
          gh release download "$TAG" --repo "$REPOSITORY" --dir "$dir"
          for asset in "$dir"/*; do
            gh release verify-asset "$TAG" "$asset" --repo "$REPOSITORY"
          done
          for asset in "$dir/desk-${TAG#v}-darwin-arm64.tar.gz" "$dir/install.sh"; do
            gh attestation verify "$asset" --repo "$REPOSITORY" \
              --cert-identity "https://github.com/$REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \
              --source-ref "refs/tags/$TAG" --source-digest "$COMMIT" --deny-self-hosted-runners
          done
