# Dependabot (docs/IMPLEMENTATION.md §23.7, D44). Its commit prefix becomes the PR title (pr-title checks only the type
# and scope of a bot's title). Only patch updates of @types/*, typescript, vitest and yaml merge themselves
# (dependabot-auto-merge.yml, once main's rules require pr-title and ci-ok, D69); the weekly GitHub Actions group is an
# owner-merge path; everything else waits for the owner. Version updates wait out a cooldown; security updates have
# none. The live image's base is named literally in /test/live/image/Dockerfile, pinned by digest (slice 1b, D78), and
# its npm tools are a project of their own in /test/live/image/tools, all runtime dependencies, so none of their
# updates is in the class that merges itself (D81).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: fix # fix(deps): …
      prefix-development: chore # chore(deps-dev): …
      include: scope
    groups:
      dev-tools:
        dependency-type: development
        update-types: [patch]
        patterns: ["@types/*", "typescript", "vitest", "yaml"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci # ci(deps): …
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/test/live/image"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: test # test(deps): …
      include: scope
  - package-ecosystem: npm
    directory: "/test/live/image/tools"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: test # test(deps): … in /test/live/image/tools
      include: scope
